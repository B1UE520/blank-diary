<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空白页日记 · 阿柚的博客存档</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:'Microsoft YaHei','PingFang SC',sans-serif;
    color:#c8d2e8;
    background:
      radial-gradient(ellipse at 15% 8%, #1a1233 0%, transparent 55%),
      radial-gradient(ellipse at 85% 15%, #0d1a33 0%, transparent 50%),
      radial-gradient(ellipse at 50% 105%, #1e1028 0%, transparent 60%),
      #05060f;
    overflow-x:hidden;
    transition:background 0.8s ease;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 30px 40px, #fff, transparent),
      radial-gradient(1.3px 1.3px at 130px 90px, #aab8e0, transparent),
      radial-gradient(1.8px 1.8px at 210px 32px, #d8c8a8, transparent),
      radial-gradient(1px 1px at 80px 170px, #888, transparent),
      radial-gradient(1.4px 1.4px at 268px 208px, #99aad0, transparent),
      radial-gradient(1.1px 1.1px at 180px 250px, #cc99bb, transparent);
    background-size:320px 280px;
    animation:twinkle 4.2s ease-in-out infinite alternate;
    opacity:.35;
  }
  @keyframes twinkle{ from{opacity:.15} to{opacity:.45} }

  /* ══════════════════════════════════════
     反向拖拽揭示层（解谜核心）
     ══════════════════════════════════════ */
  #revealLayer{
    position:fixed; inset:0;
    z-index:9998;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
    padding:40px 20px;
    background:rgba(8,0,18,.62);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    clip-path:inset(0 0 0 100%);
    opacity:0;
    transition:opacity .35s;
  }
  #revealLayer .rv-text{
    font-size:clamp(17px,3.4vw,30px);
    font-weight:900;
    letter-spacing:6px;
    line-height:2;
    color:#ffd6f0;
    text-shadow:
      0 0 12px rgba(255,140,220,.85),
      0 0 36px rgba(255,100,200,.5),
      0 0 80px rgba(180,80,255,.35);
    font-family:'KaiTi','STKaiti','Kaiti SC',serif;
    opacity:0;
    transform:translateX(30px);
    animation:rvIn .9s forwards;
  }
  #revealLayer .rv-text:nth-child(1){animation-delay:.05s}
  #revealLayer .rv-text:nth-child(2){animation-delay:.2s}
  #revealLayer .rv-text:nth-child(3){animation-delay:.35s}
  #revealLayer .rv-text:nth-child(4){animation-delay:.5s}
  #revealLayer .rv-text:nth-child(5){animation-delay:.65s}
  #revealLayer .rv-text:nth-child(6){animation-delay:.8s}
  #revealLayer .rv-small{
    font-size:11px; letter-spacing:4px; color:#7a5a90;
    margin-top:10px; opacity:.7;
  }
  @keyframes rvIn{ to{opacity:1; transform:translateX(0);} }

  /* ── 顶部 ── */
  .site-header{position:relative;z-index:1;text-align:center;padding:30px 14px 6px;}
  .logo{
    font-size:clamp(26px,5.5vw,48px);
    font-weight:900; letter-spacing:12px; line-height:1.3;
    color:#e8eef8;
    text-shadow:0 0 20px rgba(180,200,255,.25),0 0 60px rgba(120,140,220,.15);
    position:relative;
  }
  .logo::after{
    content:"";
    display:block; width:60px; height:1px; margin:10px auto 0;
    background:linear-gradient(90deg,transparent,#6a7aa0,transparent);
  }
  .subtitle{font-size:12px;color:#6a7898;letter-spacing:4px;margin-top:10px;}
  .stop-note{font-size:11px;color:#4a5570;letter-spacing:2px;margin-top:6px;}

  /* ── SAN 条 ── */
  .san-bar{
    position:relative; z-index:1;
    max-width:420px; margin:18px auto 0; padding:0 16px;
    display:flex; align-items:center; gap:10px;
    font-size:11px; letter-spacing:2px; color:#6a7898;
  }
  .san-track{
    flex:1; height:4px; border-radius:2px;
    background:rgba(255,255,255,.06);
    overflow:hidden;
  }
  .san-fill{
    height:100%; width:100%;
    background:linear-gradient(90deg,#5a7ad0,#8aa8e0,#c8d8f0);
    border-radius:2px;
    transition:width 1s ease, background 1s ease;
  }
  .san-value{min-width:32px; text-align:right; font-weight:700; color:#8a9ac0;}

  /* ── 时间线 ── */
  .timeline{
    position:relative; z-index:1;
    display:flex; justify-content:center; flex-wrap:wrap;
    gap:8px; padding:20px 16px 22px;
  }
  .tl-btn{
    font-family:inherit; cursor:pointer; font-size:12px;
    padding:8px 16px; border-radius:3px;
    border:1px solid #2a3355;
    background:rgba(12,16,32,.8);
    color:#7a88a8; letter-spacing:1px;
    transition:all .2s;
    position:relative;
  }
  .tl-btn:hover{border-color:#5a6a9a; color:#c0cce8;}
  .tl-btn.active{
    background:rgba(40,50,90,.9);
    border-color:#7a8ac0; color:#e8eef8;
    box-shadow:0 0 12px rgba(120,140,220,.2);
  }
  .tl-btn.egg{
    border-style:dashed; border-color:#3a3055;
    color:#5a4878;
  }
  .tl-btn.egg:hover{border-color:#8a6ab0; color:#b090d0;}
  .tl-btn.locked{
    color:#4a5570;
    border-color:#1e2438;
  }
  .tl-btn.locked::after{
    content:"🔒";
    font-size:9px;
    margin-left:6px;
    opacity:.7;
  }

  /* ── 布局 ── */
  .layout{
    position:relative; z-index:1;
    max-width:1280px; margin:0 auto; padding:0 16px 50px;
    display:grid; grid-template-columns:200px minmax(0,1fr) 200px;
    gap:16px; align-items:start;
  }
  @media(max-width:980px){ .layout{grid-template-columns:1fr;} }

  /* ── 侧边便签 ── */
  .side{position:sticky; top:14px;}
  @media(max-width:980px){ .side{position:static;} }
  .side-title{
    font-size:11px; letter-spacing:3px; text-align:center;
    color:#5a6a90; margin-bottom:10px;
  }
  .note{
    background:rgba(255,248,220,.9); color:#4a3a20;
    padding:8px 10px; margin-bottom:8px;
    border-radius:2px; font-size:12px; line-height:1.7;
    box-shadow:1px 2px 6px rgba(0,0,0,.4);
    outline:none; transition:box-shadow .15s;
  }
  .note:nth-child(even){background:rgba(220,235,255,.9); color:#2a3a50;}
  .note:focus{box-shadow:0 0 0 2px rgba(140,160,220,.5),1px 2px 6px rgba(0,0,0,.4);}
  .mini-btn{
    display:block; width:100%; cursor:pointer;
    font-family:inherit; font-size:11px;
    padding:5px 8px; border-radius:3px;
    border:1px dashed #2a3355; background:rgba(12,16,32,.6);
    color:#5a6a90; transition:.15s; letter-spacing:1px;
  }
  .mini-btn:hover{background:rgba(30,40,80,.7); border-color:#5a6a9a; color:#a0b0d0;}

  /* ── 主贴区域 ── */
  .era{
    position:relative;
    background:var(--era-bg,#f5f5f0);
    color:var(--era-ink,#1a1a1a);
    font-family:var(--era-font,'KaiTi','STKaiti','Kaiti SC',serif);
    border-radius:4px;
    padding:16px;
    border:1px solid rgba(255,255,255,.15);
    box-shadow:0 20px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(120,150,255,.08);
    transition:background .6s, color .6s, font-family .3s;
    filter:saturate(calc(1 - var(--sf,0) * 0.85))
           contrast(calc(1 - var(--sf,0) * 0.12))
           blur(calc(var(--sf,0) * 0.8px));
    overflow:hidden;
  }
  .era::after{
    content:"";
    position:absolute; inset:0; pointer-events:none; z-index:20;
    background-image:
      repeating-linear-gradient(112deg, transparent 0 2px, rgba(0,0,0,.025) 2px 3px),
      repeating-linear-gradient(-68deg, transparent 0 4px, rgba(0,0,0,.015) 4px 5px),
      repeating-linear-gradient(0deg, transparent 0 80px, rgba(0,0,0,.02) 80px 81px);
    opacity:calc(var(--sf,0) * 0.9);
    mix-blend-mode:multiply;
  }

  @keyframes jitter{
    0%{transform:translate(0,0);}
    20%{transform:translate(0.6px,-0.4px);}
    40%{transform:translate(-0.5px,0.5px);}
    60%{transform:translate(0.4px,0.6px);}
    80%{transform:translate(-0.6px,-0.3px);}
    100%{transform:translate(0,0);}
  }
  .era.san-5,.era.san-2,.era.san-0{animation:jitter 0.18s infinite;}

  /* 工具栏 */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    font-size:11px;
    padding:6px 10px; margin-bottom:14px;
    border:1px dashed rgba(0,0,0,.15);
    border-radius:3px;
    background:rgba(255,255,255,.25);
  }
  .toolbar .tb-label{font-weight:700; letter-spacing:2px; opacity:.5;}
  .toolbar label{display:inline-flex; align-items:center; gap:4px;}
  .toolbar input[type=color]{
    width:28px; height:20px; padding:0; border:1px solid rgba(0,0,0,.2);
    border-radius:2px; background:none; cursor:pointer;
  }
  .toolbar select{
    font-family:inherit; font-size:11px; padding:2px 5px;
    border-radius:2px; border:1px solid rgba(0,0,0,.2);
    background:rgba(255,255,255,.7); color:#222;
  }
  .toolbar button{
    font-family:inherit; font-size:11px; cursor:pointer;
    padding:3px 10px; border-radius:3px;
    border:1px solid rgba(0,0,0,.2);
    background:rgba(255,255,255,.5); color:inherit;
    letter-spacing:1px;
  }
  .toolbar button:hover{background:#fff;}

  /* 章节标签 */
  .chapter-tag{
    display:inline-block;
    font-size:11px; font-weight:700; letter-spacing:3px;
    padding:3px 14px; margin-bottom:12px;
    border-radius:2px;
    background:rgba(0,0,0,.06);
    border:1px solid rgba(0,0,0,.12);
    opacity:.7;
  }

  /* 帖子头部 */
  .post-head{
    display:flex; align-items:center; gap:12px;
    padding-bottom:14px;
    border-bottom:1px solid rgba(0,0,0,.1);
    margin-bottom:14px;
  }
  .avatar{
    width:44px; height:44px; flex:0 0 44px;
    display:grid; place-items:center;
    font-size:18px; border-radius:50%;
    background:linear-gradient(135deg,#3a3055,#201838);
    border:1px solid rgba(255,255,255,.1);
    color:#8a7aaa;
    box-shadow:0 2px 10px rgba(0,0,0,.3);
  }
  .who{flex:1; min-width:0;}
  .uname{font-weight:900; font-size:15px; outline:none;}
  .badge{
    display:inline-block; margin-left:8px;
    font-size:10px; padding:0 8px; border-radius:2px;
    background:rgba(120,140,220,.25);
    color:#6a7aa8; font-weight:700;
    border:1px solid rgba(120,140,220,.3);
  }
  .meta{font-size:11px; opacity:.5; margin-top:3px;}
  .post-time{font-size:11px; opacity:.5; white-space:nowrap;}

  .post-title{
    margin:0 0 14px; padding:0;
    font-size:17px; font-weight:900; outline:none;
    line-height:1.6;
  }

  /* 段落 */
  .section{padding:4px 0 2px;}
  .sec-tag{
    display:inline-block;
    font-size:11px; font-weight:700; letter-spacing:2px;
    padding:2px 10px; margin-bottom:8px;
    border-radius:2px;
    background:rgba(0,0,0,.05);
    border:1px solid rgba(0,0,0,.1);
    opacity:.6;
  }
  .sec-body{
    font-size:14px; line-height:2.1; white-space:pre-wrap;
    outline:none; padding:6px 8px; border-radius:3px;
    border:1px dashed transparent;
    transition:border-color .2s;
  }
  .sec-body:hover{border-color:rgba(0,0,0,.12);}
  .sec-body:focus{border-color:rgba(100,140,220,.5); background:rgba(255,255,255,.4);}

  /* 照片 */
  .photo{
    margin:14px 0 10px;
    width:fit-content; max-width:100%;
    background:#fff; padding:10px 10px 6px;
    border-radius:2px;
    box-shadow:0 6px 24px rgba(0,0,0,.35);
    transform:rotate(-0.8deg);
  }
  .photo:nth-of-type(even){transform:rotate(0.9deg);}
  .photo img{display:block; width:100%; max-width:320px; border-radius:1px;}
  .photo figcaption{
    font-size:11px; color:#555 !important;
    text-align:center; padding:6px 2px 2px; outline:none;
    font-family:'Microsoft YaHei',sans-serif;
  }

  /* 附件 */
  .attachments{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    margin:14px 0 0; padding-top:12px;
    border-top:1px dashed rgba(0,0,0,.12);
    font-size:12px;
  }
  .attach{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 10px; border-radius:2px;
    background:rgba(0,0,0,.04);
    border:1px solid rgba(0,0,0,.1);
  }
  .attach-name{outline:none;}
  .attach-open{color:#3a5a9a; text-decoration:none; font-size:11px;}
  .attach-open:hover{text-decoration:underline;}

  /* 回复 */
  .replies-head{
    margin:22px 0 10px; font-size:13px; font-weight:700;
    letter-spacing:2px; opacity:.6;
  }
  .reply{
    display:flex; gap:10px;
    padding:11px 12px; margin-bottom:7px;
    background:rgba(255,255,255,.4);
    border-left:3px solid rgba(100,120,180,.4);
    border-radius:0 4px 4px 0;
    border-top:1px solid rgba(0,0,0,.04);
    border-right:1px solid rgba(0,0,0,.04);
    border-bottom:1px solid rgba(0,0,0,.04);
  }
  .r-avatar{
    width:32px;height:32px;flex:0 0 32px;
    display:grid;place-items:center;border-radius:50%;
    font-size:14px; color:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .r-main{flex:1; min-width:0;}
  .r-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .r-name{font-weight:700; font-size:13px; outline:none;}
  .r-floor{
    font-size:10px; padding:0 6px; border-radius:2px;
    background:rgba(0,0,0,.06); opacity:.6;
  }
  .r-time{font-size:10px; opacity:.45;}
  .del{
    margin-left:auto; width:auto; padding:1px 8px;
    font-size:10px; border-radius:2px;
  }
  .r-text{
    margin-top:5px; font-size:13px; line-height:1.9;
    white-space:pre-wrap; outline:none;
    padding:3px 6px; border-radius:3px;
    border:1px dashed transparent;
  }
  .r-text:hover{border-color:rgba(0,0,0,.1);}
  .r-text:focus{border-color:rgba(100,140,220,.4); background:rgba(255,255,255,.5);}

  .add-reply{
    display:block; width:100%; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:700;
    padding:10px; margin-top:10px;
    border-radius:4px;
    border:1px dashed rgba(0,0,0,.2);
    background:rgba(255,255,255,.3);
    color:inherit; transition:.15s; letter-spacing:2px;
  }
  .add-reply:hover{background:rgba(255,255,255,.6); border-color:rgba(100,140,220,.5);}

  /* ── 锁屏 ── */
  .locked-era{
    background:#0a0c16 !important;
    color:#5a6a90 !important;
    border-color:#1e2438 !important;
    filter:none !important;
    display:grid;
    place-items:center;
    min-height:420px;
  }
  .locked-era::after{display:none;}
  .lock-box{
    display:flex; flex-direction:column; align-items:center;
    gap:14px;
    padding:40px 26px;
    text-align:center;
    max-width:420px;
    width:100%;
  }
  .lock-box.shake{animation:shakeIt .4s;}
  @keyframes shakeIt{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-9px);}
    40%{transform:translateX(9px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }
  .lock-icon{
    font-size:44px; opacity:.6;
    filter:grayscale(.4);
  }
  .lock-title{
    font-size:16px; font-weight:900; letter-spacing:4px;
    color:#8a9ac0;
  }
  .lock-hint{
    font-size:12px; letter-spacing:1px;
    color:#4a5a80;
    font-family:'KaiTi','STKaiti',serif;
    line-height:2;
    padding:10px 14px;
    border-left:2px solid #2a3355;
    text-align:left;
    max-width:100%;
  }
  .lock-hint b{color:#7a8ac0;}
  .lock-input{
    width:100%;
    font-family:inherit; font-size:15px;
    letter-spacing:6px;
    text-align:center;
    padding:11px 14px;
    border-radius:3px;
    border:1px solid #2a3355;
    background:#080a12;
    color:#c0cce8;
    outline:none;
    transition:.2s;
  }
  .lock-input:focus{
    border-color:#5a6a9a;
    box-shadow:0 0 0 3px rgba(90,110,170,.15);
  }
  .lock-input::placeholder{letter-spacing:2px; color:#3a4460;}
  .lock-btn{
    width:100%;
    font-family:inherit; font-size:13px; font-weight:700;
    letter-spacing:4px;
    padding:11px;
    cursor:pointer;
    border-radius:3px;
    border:1px solid #3a4a7a;
    background:rgba(30,40,90,.7);
    color:#b0c0e8;
    transition:.2s;
  }
  .lock-btn:hover{
    background:rgba(50,65,130,.8);
    border-color:#5a6a9a;
    color:#e8eef8;
  }
  .lock-msg{
    font-size:12px; letter-spacing:2px;
    color:#a06070;
    min-height:18px;
  }
  .lock-msg.ok{color:#60a080;}

  /* ── 访客计数器 ── */
  .visitor-counter{
    margin-top:20px;
    padding:14px 16px;
    border-radius:3px;
    background:rgba(0,0,0,.05);
    border:1px dashed rgba(0,0,0,.14);
    display:flex; align-items:center; gap:12px;
    flex-wrap:wrap;
    font-family:'Consolas','Courier New',monospace;
    font-size:12px;
    letter-spacing:1px;
  }
  .vc-label{
    font-weight:700;
    opacity:.55;
    letter-spacing:3px;
  }
  .vc-num{
    font-size:22px;
    font-weight:900;
    letter-spacing:3px;
    color:#b03a5a;
    text-shadow:0 0 10px rgba(180,60,90,.3);
    font-variant-numeric:tabular-nums;
    transition:color .2s;
  }
  .vc-num.flash{color:#e06a8a;}
  .vc-note{
    margin-left:auto;
    font-size:10px;
    opacity:.4;
    letter-spacing:2px;
  }

  /* ── 序章特殊 ── */
  .blank-page{
    background:#fafafa; color:#ccc;
    min-height:300px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    border:1px dashed rgba(0,0,0,.1);
    border-radius:4px;
    padding:60px 20px;
  }
  .blank-page .faint{
    font-size:11px; color:#bbb; letter-spacing:6px;
    margin-top:20px; opacity:0;
    transition:opacity 2s ease;
  }
  .blank-page:hover .faint{opacity:1;}

  /* 母亲日记本 */
  .egg-page{
    background:#1a1020 !important;
    color:#b090c8 !important;
    border:1px solid rgba(160,100,200,.2) !important;
    box-shadow:0 0 40px rgba(120,60,160,.15), 0 20px 60px rgba(0,0,0,.7) !important;
  }
  .egg-page .post-title{color:#d0a8e8;}
  .egg-page .sec-body{color:#b898d0;}
  .egg-page .chapter-tag{background:rgba(160,100,200,.1); border-color:rgba(160,100,200,.2); color:#a080c0;}
  .egg-page .reply{background:rgba(60,30,80,.3); border-left-color:rgba(160,100,200,.3);}
  .egg-page .add-reply{border-color:rgba(160,100,200,.2); color:#a080c0;}
  .egg-page .add-reply:hover{background:rgba(160,100,200,.1);}
  .egg-page .toolbar{border-color:rgba(160,100,200,.15); background:rgba(160,100,200,.05);}

  /* ══════════════════════════════════════
     突脸恐怖层
     ══════════════════════════════════════ */
  #jumpscare{
    position:fixed; inset:0;
    z-index:99999;
    display:none;
    place-items:center;
    background:#000;
    text-align:center;
    cursor:none;
    overflow:hidden;
  }
  #jumpscare.active{display:grid;}
  #jumpscare::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 3px 4px);
    pointer-events:none;
    animation:scan 0.08s infinite linear;
  }
  @keyframes scan{ to{transform:translateY(4px);} }
  .js-text{
    font-size:clamp(22px,5.5vw,64px);
    color:#e8e8e8;
    font-weight:900;
    letter-spacing:8px;
    line-height:1.5;
    max-width:92vw;
    padding:0 20px;

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setPath(obj, path, val){
  const parts = path.split('.'); let o = obj;
  for(let i=0;i<parts.length-1;i++){
    const k = parts[i];
    if(o[k] === undefined) return;
    o = o[k];
  }
  o[parts[parts.length-1]] = val;
}
function nowStr(){

/* ══════════════════════════════════════════════
   手写日记本 SVG
   ══════════════════════════════════════════════ */
function doodleSVG(type, x, y, c, ink){
  const t = type || 'star';
  if(t === 'flower'){
    let p = '';
    for(let i=0;i<5;i++){
      p += `<ellipse cx="0" cy="-14" rx="7" ry="13" fill="${c}" transform="rotate(${i*72})"/>`;
    }
    return `<g transform="translate(${x},${y})" opacity=".85">${p}
      <circle r="6" fill="#e8d888" stroke="${ink}" stroke-width="1"/></g>`;
  }
  if(t === 'heart'){
    return `<path d="M${x} ${y+7} C ${x-22} ${y-13}, ${x-6} ${y-30}, ${x} ${y-13}
      C ${x+6} ${y-30}, ${x+22} ${y-13}, ${x} ${y+7} Z"
      fill="${c}" stroke="${ink}" stroke-width="1" opacity=".85"/>`;
  }
  if(t === 'moon'){
    return `<path d="M${x} ${y-24} a 20 20 0 1 0 15 33 a 16 16 0 1 1 -15 -33 Z"
      fill="${c}" stroke="${ink}" stroke-width="1" opacity=".85"/>`;
  }
  if(t === 'cloud'){
    return `<path d="M${x-30} ${y} q 0 -17 17 -15 q 3 -15 20 -11 q 15 -5 20 10
      q 15 0 13 17 Z" fill="${c}" stroke="${ink}" stroke-width="1" opacity=".8"/>`;
  }
  const pts = [];
  for(let i=0;i<10;i++){
    const r = (i % 2) ? 7 : 19;
    const a = -Math.PI/2 + i * Math.PI/5;
    pts.push(`${(x+Math.cos(a)*r).toFixed(1)},${(y+Math.sin(a)*r).toFixed(1)}`);
  }
  return `<polygon points="${pts.join(' ')}" fill="${c}" stroke="${ink}" stroke-width="1" opacity=".85"/>`;
}

function makeDiary(cfg){
  const W = 540, H = 740;
  const R = mulberry32(cfg.seed * 9973 + 17);
  const ink = cfg.ink, paper = cfg.paper, accent = cfg.accent;
  let s = '';

  s += `<rect width="${W}" height="${H}" fill="#c8d0dc"/>`;
  s += `<rect width="${W}" height="${H}" fill="url(#desk)"/>`;

  const rot = (R() - 0.5) * 2.8;
  s += `<g transform="rotate(${rot.toFixed(2)} ${W/2} ${H/2})">`;
  s += `<rect x="32" y="24" width="${W-64}" height="${H-56}" rx="2"
          fill="${paper}" stroke="#aab4c4" stroke-width="2"/>`;

  for(let y = 200; y < H-80; y += 36){
    s += `<line x1="86" y1="${y}" x2="${W-68}" y2="${y}" stroke="#d0dae8" stroke-width="1.2"/>`;
  }
  s += `<line x1="80" y1="30" x2="80" y2="${H-36}" stroke="#e8a0b0" stroke-width="1.3" opacity=".8"/>`;
  for(let y = 86; y < H-66; y += 88){
    s += `<circle cx="52" cy="${y}" r="6" fill="#c8d0dc" stroke="#a0aab8"/>`;
  }

  s += `<text x="94" y="134" font-family="KaiTi,STKaiti,serif" font-size="24"
          fill="${ink}" opacity=".85">${esc(cfg.dateText)}</text>`;
  s += `<path d="M92 146 q 90 6 186 0" fill="none" stroke="${ink}"
          stroke-width="1.3" opacity=".35"/>`;

  const total = 13 + Math.floor(R() * 4);
  for(let i = 0; i < total; i++){
    const lineY = 200 + i * 36;
    if(lineY > H - 86) break;
    const startX = 86 + R() * 8;
    const endX = startX + (0.5 + R() * 0.48) * (W - 156);
    let d = `M${startX.toFixed(1)} ${lineY.toFixed(1)}`;
    let x = startX;
    while(x < endX){
      const step = 7 + R() * 10;
      const dy = (R() - 0.5) * 6;
      d += ` q ${(step/2).toFixed(1)} ${dy.toFixed(1)} ${step.toFixed(1)} 0`;
      x += step;
    }
    s += `<path d="${d}" fill="none" stroke="${ink}" stroke-width="1.5"
            stroke-linecap="round" opacity="${(0.5 + R()*0.35).toFixed(2)}"/>`;
  }

  s += doodleSVG(cfg.doodle, W - 118, H - 110, accent, ink);
  s += `<g transform="rotate(-6 ${W/2} 36)">
          <rect x="${W/2 - 56}" y="14" width="112" height="26" fill="${accent}" opacity=".35"/>
        </g>`;

  s += `</g>`;

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"
      viewBox="0 0 ${W} ${H}">
      <defs>
        <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#d4dce8"/>
          <stop offset="100%" stop-color="#b8c4d4"/>
        </linearGradient>
      </defs>${s}</svg>`;

  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

const KEY = 'blank_diary_arg_v2';
let state;
let jumpscareShown = false;

function loadState(){
  const base = JSON.parse(JSON.stringify(DEFAULT_STATE));
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return base;
    const p = JSON.parse(raw);
    if(typeof p.current === 'number') base.current = p.current;
    if(Array.isArray(p.leftNotes))  base.leftNotes  = p.leftNotes;
    if(Array.isArray(p.rightNotes)) base.rightNotes = p.rightNotes;
    if(Array.isArray(p.unlocked))   base.unlocked   = p.unlocked;
    if(Array.isArray(p.eras)){
      p.eras.forEach((e, i)=>{
        if(!base.eras[i]) return;
        const theme = Object.assign({}, base.eras[i].theme, e.theme || {});
        Object.assign(base.eras[i], e);
        base.eras[i].theme = theme;
      });
    }
  }catch(err){}
  return base;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(err){}
}

/* ══════════════════════════════════════════════

const timelineEl = $('#timeline');
const centerEl   = $('#center');
const sideLeftEl = $('#sideLeft');
const sideRightEl= $('#sideRight');
const sanFill    = $('#sanFill');
const sanValue   = $('#sanValue');

const AVATARS = [
  {t:'🍪', c:'#8a6a4a'}, {t:'🌙', c:'#5a4a8a'}, {t:'🐟', c:'#3a6a8a'},
  {t:'🍀', c:'#4a8a6a'}, {t:'⭐', c:'#9a7a3a'}, {t:'☁️', c:'#6a7a9a'},
  {t:'🍧', c:'#9a5a7a'}, {t:'🎧', c:'#4a5a9a'}
];

function sanClass(s){
  if(s >= 100) return 'san-100';
  if(s >= 85)  return 'san-85';
  if(s >= 68)  return 'san-68';
  if(s >= 48)  return 'san-48';
  if(s >= 26)  return 'san-26';
  if(s >= 14)  return 'san-14';
  if(s >= 5)   return 'san-5';
  if(s >= 2)   return 'san-2';
  return 'san-0';
}
function sanFactor(s){ return Math.max(0, Math.min(1, (100 - s) / 100)); }

function updateSanBar(s){
  const pct = Math.max(0, Math.min(100, s));
  sanFill.style.width = pct + '%';
  sanValue.textContent = pct;
  if(pct > 60) sanFill.style.background = 'linear-gradient(90deg,#5a7ad0,#8aa8e0,#c8d8f0)';
  else if(pct > 30) sanFill.style.background = 'linear-gradient(90deg,#6a5a9a,#9a7ab0)';
  else sanFill.style.background = 'linear-gradient(90deg,#8a3a4a,#b05a5a)';
}

function replyHTML(eraIdx, j, r){
  const av = AVATARS[j % AVATARS.length];
  return `
  <div class="reply" data-ri="${j}">
    <div class="r-avatar" style="background:${av.c}">${av.t}</div>
    <div class="r-main">
      <div class="r-top">
        <span class="r-name" contenteditable data-key="eras.${eraIdx}.replies.${j}.name">${r.name}</span>
        <span class="r-floor">${j + 1}楼</span>
        <span class="r-time" contenteditable data-key="eras.${eraIdx}.replies.${j}.date">${r.date}</span>
        <button class="mini-btn del" data-act="del-reply" data-ri="${j}">✕</button>
      </div>
      <div class="r-text" contenteditable data-key="eras.${eraIdx}.replies.${j}.text">${r.text}</div>
    </div>
  </div>`;
}

          <span class="badge">${isEgg ? '隐藏' : '楼主'}</span>

        <div class="sec-body" contenteditable data-key="eras.${i}.mood">${e.mood}</div>

      ${e.replies.map((r, j) => replyHTML(i, j, r)).join('')}

function renderSide(el, notes, key){
  el.innerHTML = `
    <div class="side-title">${el.dataset.title}</div>

      ${notes.map((n, i) =>
        `<div class="note" contenteditable data-key="${key}.${i}">${n}</div>`

function renderTimeline(){
  timelineEl.innerHTML = state.eras.map((e, i) => {
    const isEgg = i === 5;
    const locked = !state.unlocked[i] && !!PASSWORDS[i];
    return `<button class="tl-btn ${i === state.current ? 'active' : ''} ${isEgg ? 'egg' : ''} ${locked ? 'locked' : ''}"
      data-idx="${i}">${esc(e.label)}</button>`;
  }).join('');
}

function renderApp(){
  renderTimeline();
  renderSide(sideLeftEl,  state.leftNotes,  'leftNotes');
  renderSide(sideRightEl, state.rightNotes, 'rightNotes');
  centerEl.innerHTML = renderEra(state.current);
  updateSanBar(state.eras[state.current].san);

  // 如果当前是最后一篇，启动访客计数器
  if(state.current === 4 && state.unlocked[4]) startVisitorCounter();
}

/* ══════════════════════════════════════════════
   访客计数器
   ══════════════════════════════════════════════ */
let visitorTimer = null;
let visitorBase = 0;

function startVisitorCounter(){
  if(visitorTimer){ clearInterval(visitorTimer); visitorTimer = null; }

  // 初始化：从 localStorage 取基础值
  const saved = parseInt(localStorage.getItem('bd_visitors') || '0', 10);
  if(!saved){
    visitorBase = 2026 + Math.floor(Math.random() * 40);
  } else {
    visitorBase = saved;
  }
  visitorBase += 1;
  localStorage.setItem('bd_visitors', visitorBase);

  const numEl = $('#visitorNum');
  if(!numEl) return;

  numEl.textContent = visitorBase;

  // 每 3~9 秒随机增长
  const tick = () => {
    visitorBase += Math.random() < 0.15 ? 2 : 1;
    localStorage.setItem('bd_visitors', visitorBase);
    const el = $('#visitorNum');
    if(el){
      el.textContent = visitorBase;
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 180);
    }
    visitorTimer = setTimeout(tick, 3000 + Math.random() * 6000);
  };
  visitorTimer = setTimeout(tick, 4000);
}

    {t:'你也是她的一部分了。',      c:'glitch',  d:2400, flash:true},
    {t:'你也要保守这个秘密。',      c:'',        d:1900},
    {t:'打死也不能说。',            c:'glitch',  d:1600, flash:true},
    {t:'不然——',                   c:'',        d:1300},
    {t:'下一个就是你。',            c:'big',     d:2800, flash:true},
    {t:'（你确定你只是读者吗？）',  c:'',        d:2400}
  ];

  for(const step of seq){
    tx.textContent = step.t;
    tx.className = 'js-text' + (step.c ? ' ' + step.c : '');
    if(step.flash){
      ov.style.background = '#fff';

  ov.classList.remove('active');
  ov.style.opacity = '';
  ov.style.transition = '';
  tx.textContent = '';
  tx.className = 'js-text';
  document.body.style.overflow = '';
}

/* ══════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════ */
function collect(){
  document.querySelectorAll('[data-key]').forEach(el => {
    setPath(state, el.dataset.key, el.innerHTML);
  });
}

function switchEra(i){
  if(i === state.current) return;
  collect();
  state.current = i;
  save();
  renderApp();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function updateTheme(kind, value){
  const era = state.eras[state.current];
  era.theme[kind] = value;
  const sec = centerEl.querySelector('.era');
  if(sec){
    if(kind === 'bg')   sec.style.setProperty('--era-bg', value);
    if(kind === 'ink')  sec.style.setProperty('--era-ink', value);
    if(kind === 'font') sec.style.setProperty('--era-font', FONTS[value].css);
  }
  save();
}

function addReply(){
  collect();
  const era = state.eras[state.current];
  era.replies.push({
    name: '匿名',
    text: '（写下你的回复……）',
    date: nowStr()
  });
  save();
  renderApp();
  const list = centerEl.querySelectorAll('.reply');
  const last = list[list.length - 1];
  if(last){
    const t = last.querySelector('.r-text');
    t.focus();
    const r = document.createRange();
    r.selectNodeContents(t);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }
}

function delReply(j){
  collect();
  const era = state.eras[state.current];
  if(era.replies.length <= 1 && !confirm('这是最后一条回复，确定要删除吗？')) return;
  era.replies.splice(j, 1);
  save();
  renderApp();
}

function addAttach(){
  collect();
  const name = prompt('附件名称（例如：健身房计划表.doc / 备考笔记.ppt）');
  if(!name) return;
  const url = prompt('链接地址', '#');
  state.eras[state.current].attachments.push({name, url: url || '#'});
  save();
  renderApp();
}

function resetTheme(){
  const def = DEFAULT_STATE.eras[state.current].theme;
  state.eras[state.current].theme = Object.assign({}, def);
  save();
  renderApp();
}

function addNote(key){
  collect();
  state[key].push('（新便签）');
  save();
  renderApp();
  const side = key === 'leftNotes' ? sideLeftEl : sideRightEl;
  const notes = side.querySelectorAll('.note');
  const last = notes[notes.length - 1];
  if(last){
    last.focus();
    const r = document.createRange();
    r.selectNodeContents(last);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }
}

/* ── 密码解锁 ── */
function tryUnlock(idx){
  const input = centerEl.querySelector('.lock-input');
  const msg   = centerEl.querySelector('.lock-msg');
  const box   = centerEl.querySelector('.lock-box');
  if(!input || !msg) return;

  const val = (input.value || '').trim().toLowerCase();
  const conf = PASSWORDS[idx];
  if(!conf) return;

  const ok = conf.keys.some(k => k.toLowerCase() === val);

  if(ok){
    msg.textContent = '解锁成功。';
    msg.classList.add('ok');
    state.unlocked[idx] = true;
    save();
    setTimeout(() => {
      renderApp();
      window.scrollTo({top: 0, behavior:'smooth'});
    }, 600);
  } else {
    msg.textContent = '密码错误。';
    msg.classList.remove('ok');
    input.value = '';
    input.focus();
    if(box){
      box.classList.add('shake');
      setTimeout(() => box.classList.remove('shake'), 420);
    }
  }
}

/* ── 反向拖拽揭示 ── */
const revealLayer = $('#revealLayer');
let revealAmount = 0;
let lastMouseX = null;
let revealRaf = null;

function applyReveal(){
  const pct = Math.max(0, Math.min(1, revealAmount));
  revealLayer.style.clipPath = `inset(0 0 0 ${(1 - pct) * 100}%)`;
  revealLayer.style.opacity = pct > 0.02 ? (0.25 + pct * 0.75) : 0;
}

document.addEventListener('mousemove', e => {
  if(lastMouseX === null){
    lastMouseX = e.clientX;
    return;
  }
  const dx = e.clientX - lastMouseX;
  lastMouseX = e.clientX;

  // 向左拖拽 → 揭示
  if(dx < -2){
    revealAmount = Math.min(1, revealAmount + Math.abs(dx) / 620);
  }
  // 向右拖拽 → 收回
  else if(dx > 2){
    revealAmount = Math.max(0, revealAmount - dx / 500);
  }

  if(!revealRaf){
    revealRaf = requestAnimationFrame(() => {
      applyReveal();
      revealRaf = null;
    });
  }
});

// 鼠标离开时缓慢收回
document.addEventListener('mouseleave', () => {
  const shrink = () => {
    revealAmount = Math.max(0, revealAmount - 0.02);
    applyReveal();
    if(revealAmount > 0) requestAnimationFrame(shrink);
  };
  shrink();
});

/* ── 滚动触发突脸 ── */
window.addEventListener('scroll', () => {
  if(jumpscareShown) return;
  if(state.current !== 2) return; // 只在第三篇（索引2）触发
  if(!state.unlocked[2]) return;

  const era = centerEl.querySelector('.era');
  if(!era) return;

  const rect = era.getBoundingClientRect();
  const total = era.offsetHeight - window.innerHeight;
  if(total <= 0) return;
  const scrolled = -rect.top;
  const ratio = scrolled / total;

  if(ratio > 0.86){
    jumpscareShown = true;
    triggerJumpscare();
  }
}, {passive:true});

/* ── 事件委托 ── */
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset && t.dataset.theme){
    if(t.dataset.theme === 'font') updateTheme('font', Number(t.value));
    else updateTheme(t.dataset.theme, t.value);
    return;
  }
  const el = t.closest && t.closest('[data-key]');
  if(el){
    setPath(state, el.dataset.key, el.innerHTML);
    save();
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.classList.contains('lock-input')){
    e.preventDefault();
    const idx = Number(e.target.dataset.idx);
    tryUnlock(idx);
  }
});

document.addEventListener('click', e => {
  const tl = e.target.closest('.tl-btn');
  if(tl){ switchEra(Number(tl.dataset.idx)); return; }

  const actEl = e.target.closest('[data-act]');
  if(actEl){
    const act = actEl.dataset.act;
    if(act === 'add-reply')    addReply();
    if(act === 'del-reply')    delReply(Number(actEl.dataset.ri));
    if(act === 'add-attach')   addAttach();
    if(act === 'reset-theme')  resetTheme();
    if(act === 'try-unlock')   tryUnlock(Number(actEl.dataset.idx));
    return;
  }

  const sideBtn = e.target.closest('[data-side]');
  if(sideBtn){ addNote(sideBtn.dataset.side); return; }
});

/* ══════════════════════════════════════════════
   启动
   ══════════════════════════════════════════════ */
state = loadState();
renderApp();
</script>
</body>
</html>
